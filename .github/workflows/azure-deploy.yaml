name: Terraform Azure Deploy 

on: 
    push:
        branches:
            - vnet
jobs:
    terraform:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
              
            - name: Setup up Terraform 
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.4.5
            
            
            - name: Azure Login
              uses: azure/login@v1
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}


            - name: Create SSH Directory
              run: mkdir -p ~/.ssh
            
            - name: Initialize Terraform 
              run: terraform init 

            - name: Generate SSH Public Key File
              run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
              shell: bash

            - name: Terraform Plan 
              run: terraform plan -var="ssh_public_key=$(cat ~/.ssh/id_rsa.pub)" -out=tfplan

            - name: Validate Terraform Code
              run: terraform validate 

            - name: Terraform Apply
              if: github.ref == 'refs/heads/main'  # Only applies on the main branch
              run: terraform apply -auto-approve tfplan